<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEJAK Mereka — Cari Kekuatan &amp; Kerjaya Anda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --gold:#E8A33D;
    --gold-deep:#C97F1F;
    --brown:#5B3A22;
    --brown-deep:#3E2A1C;
    --green:#2F6E4F;
    --green-deep:#1F4D37;
    --red:#C8443A;
    --cream:#FBF3E3;
    --cream-2:#F3E5C8;
    --ink:#221B14;
    --paper:#FFFCF5;
    --line:rgba(34,27,20,0.14);
    --radius:18px;
    --shadow: 0 10px 30px rgba(62,42,28,0.14);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(232,163,61,0.18), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(47,110,79,0.13), transparent 55%),
      var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace; letter-spacing:0.02em;}
  a{color:inherit;}
  button{font-family:inherit;}

  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 60px;}

  /* ---------- topbar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(155deg,var(--gold),var(--red));display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex-shrink:0;}
  .brand-mark svg{width:20px;height:20px;}
  .brand-name{font-weight:800;font-size:1.15rem;letter-spacing:0.01em;}
  .brand-sub{font-size:0.72rem;color:var(--brown);opacity:0.75;margin-top:-2px;}

  .lang-toggle{display:flex;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .lang-toggle button{border:none;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;font-size:0.78rem;cursor:pointer;color:var(--brown);transition:all .18s ease;}
  .lang-toggle button.active{background:var(--ink);color:var(--cream);}

  /* ---------- start screen ---------- */
  .hero{background:var(--paper);border-radius:24px;padding:36px 28px;box-shadow:var(--shadow);border:1.5px solid var(--line);position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,163,61,0.35),transparent 70%);}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:0.72rem;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--green-deep);background:rgba(47,110,79,0.1);padding:6px 12px;border-radius:999px;margin-bottom:16px;}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green-deep);}
  .hero h1{font-size:2.15rem;line-height:1.12;margin:0 0 12px;font-weight:800;color:var(--brown-deep);}
  .hero h1 span{color:var(--red);}
  .hero p.lead{font-size:1.02rem;line-height:1.55;color:var(--ink);opacity:0.85;max-width:56ch;margin:0 0 22px;}
  .meta-row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:26px;}
  .meta-item{display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--brown);font-weight:600;}
  .meta-item svg{width:16px;height:16px;flex-shrink:0;}
  .start-btn{background:var(--ink);color:var(--cream);border:none;border-radius:14px;padding:15px 26px;font-size:1rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(34,27,20,0.28);transition:transform .15s ease, box-shadow .15s ease;}
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(34,27,20,0.32);}
  .start-btn svg{width:18px;height:18px;}

  .type-preview{margin-top:30px;}
  .type-preview .cap{font-size:0.78rem;font-weight:700;color:var(--brown);opacity:0.7;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.07em;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}

  .about-panel{background:var(--paper);border-radius:22px;padding:28px 26px;box-shadow:var(--shadow);border:1.5px solid var(--line);margin-top:20px;}
  .about-panel .eyebrow{background:rgba(200,68,58,0.1);color:var(--red);}
  .about-panel .eyebrow .dot{background:var(--red);}
  .about-panel h3{font-size:1.35rem;margin:0 0 12px;color:var(--brown-deep);font-weight:800;}
  .about-panel p{font-size:0.93rem;line-height:1.7;color:var(--ink);opacity:0.86;margin:0 0 20px;}
  .about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .about-stat{background:var(--cream);border:1.5px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;}
  .about-stat-num{font-family:'Baloo 2',sans-serif;font-size:1.35rem;font-weight:800;color:var(--red);line-height:1.1;}
  .about-stat-label{font-size:0.72rem;color:var(--brown);font-weight:600;margin-top:4px;line-height:1.35;}
  @media (max-width:520px){.about-stats{grid-template-columns:1fr;}}

  .origin-box{margin-top:22px;background:rgba(232,163,61,0.14);border:1.5px dashed var(--gold-deep);border-radius:14px;padding:16px 18px;font-size:0.9rem;line-height:1.6;color:var(--brown-deep);}
  .origin-box b{color:var(--red);}

  .feature-box{margin-top:20px;background:var(--cream);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;}
  .feature-box h4{margin:0 0 8px;font-size:1rem;font-weight:800;color:var(--brown-deep);display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;}
  .feature-box h4 svg{width:18px;height:18px;color:var(--red);}
  .feature-box p{margin:0 0 12px;font-size:0.87rem;line-height:1.6;color:var(--ink);opacity:0.85;}
  .prompt-box{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:0.76rem;line-height:1.6;color:var(--brown-deep);max-height:130px;overflow-y:auto;white-space:pre-wrap;margin-bottom:12px;}
  .btn-small{border-radius:10px;padding:9px 16px;font-weight:700;font-size:0.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;border:1.6px solid var(--brown-deep);background:var(--brown-deep);color:var(--cream);}
  .btn-small svg{width:14px;height:14px;}

  .connect-panel{margin-top:22px;background:linear-gradient(155deg,var(--brown-deep),var(--ink));border-radius:18px;padding:20px 22px;color:var(--cream);}
  .connect-panel h4{margin:0 0 6px;font-size:1.05rem;font-weight:800;font-family:'Baloo 2',sans-serif;}
  .connect-panel p{margin:0 0 16px;font-size:0.85rem;line-height:1.6;opacity:0.88;}
  .connect-row{display:flex;flex-wrap:wrap;gap:9px;}
  .social-btn{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--cream);transition:background .15s ease;}
  .social-btn:hover{background:rgba(255,255,255,0.22);}
  .social-btn svg{width:18px;height:18px;}
  .connect-cta{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--brown-deep);border:none;border-radius:11px;padding:0 16px;font-weight:700;font-size:0.83rem;text-decoration:none;height:38px;}
  .connect-cta svg{width:15px;height:15px;}
  .chip{font-size:0.78rem;font-weight:600;padding:6px 12px 6px 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--cream-2);color:var(--brown-deep);display:inline-flex;align-items:center;gap:7px;}
  .chip-code{font-size:0.7rem;font-weight:700;background:var(--brown-deep);color:var(--cream);padding:2px 7px;border-radius:999px;letter-spacing:0.03em;}

  /* ---------- quiz screen ---------- */
  .quiz-card{background:var(--paper);border-radius:22px;padding:30px 26px;box-shadow:var(--shadow);border:1.5px solid var(--line);}
  .trail{display:flex;align-items:center;gap:4px;margin-bottom:22px;}
  .trail-track{flex:1;height:10px;border-radius:999px;background:var(--cream-2);position:relative;overflow:hidden;border:1px solid var(--line);}
  .trail-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .35s ease;}
  .trail-label{font-size:0.75rem;font-weight:700;color:var(--brown);white-space:nowrap;padding-left:10px;}

  .q-num{font-size:0.78rem;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;}
  .q-text{font-size:1.28rem;font-weight:700;line-height:1.4;color:var(--brown-deep);margin:0 0 22px;font-family:'Baloo 2',sans-serif;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    text-align:left;
    background:var(--cream);
    border:1.6px solid var(--line);
    border-radius:14px;
    padding:15px 18px;
    font-size:0.97rem;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    line-height:1.4;
    display:flex;
    align-items:center;
    gap:12px;
    transition:all .15s ease;
  }
  .option .letter{
    flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--paper);border:1.6px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.78rem;color:var(--brown);
  }
  .option:hover{background:var(--cream-2);border-color:var(--gold-deep);transform:translateX(2px);}
  .option:hover .letter{background:var(--gold);border-color:var(--gold-deep);color:var(--brown-deep);}

  .back-link{display:inline-flex;align-items:center;gap:6px;margin-top:20px;font-size:0.82rem;font-weight:600;color:var(--brown);opacity:0.7;background:none;border:none;cursor:pointer;padding:4px;}
  .back-link:hover{opacity:1;}

  /* ---------- results ---------- */
  .result-card{background:linear-gradient(160deg,var(--brown-deep),var(--ink));border-radius:24px;padding:4px;box-shadow:var(--shadow);}
  .result-inner{background:var(--paper);border-radius:20px;padding:30px 26px;position:relative;overflow:hidden;}
  .kad-strip{position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,var(--gold),var(--red),var(--green));}
  .kad-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:14px;}
  .kad-label{font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--brown);opacity:0.6;}
  .kad-code{font-family:'IBM Plex Mono',monospace;font-size:0.72rem;font-weight:600;color:var(--red);background:rgba(200,68,58,0.09);padding:4px 10px;border-radius:8px;}

  .code-hero{display:flex;align-items:center;gap:16px;margin-bottom:4px;}
  .code-hero-badge{font-family:'Baloo 2',sans-serif;font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:0.01em;color:var(--brown-deep);position:relative;display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:50%;flex-shrink:0;}
  .code-hero-badge::before{content:"";position:absolute;inset:0;border-radius:50%;border:2.5px dashed currentColor;opacity:0.35;}
  .code-hero-tag{font-family:'IBM Plex Mono',monospace;font-size:0.62rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.6;margin-bottom:2px;}
  .code-hero-sub{font-size:0.82rem;font-weight:600;color:var(--brown);opacity:0.75;margin-top:4px;}
  .letter-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .legend-pill{display:flex;align-items:center;gap:6px;font-size:0.74rem;font-weight:600;color:var(--brown-deep);background:var(--cream);border:1.5px solid var(--line);border-radius:999px;padding:5px 10px 5px 6px;}
  .legend-pill.on{background:var(--brown-deep);color:var(--cream);border-color:var(--brown-deep);}
  .legend-letter{width:20px;height:20px;border-radius:6px;background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:0.72rem;color:var(--brown-deep);}
  .legend-pill.on .legend-letter{background:var(--cream);color:var(--brown-deep);}

  .result-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow);}
  .result-icon svg{width:34px;height:34px;}
  .result-title-row{display:flex;align-items:center;gap:16px;margin-bottom:6px;}
  .result-name{font-size:1.85rem;font-weight:800;color:var(--brown-deep);margin:0;line-height:1.1;}
  .result-name-en{font-size:0.95rem;font-weight:600;color:var(--red);margin:2px 0 0;}
  .result-tagline{font-size:1rem;line-height:1.5;color:var(--ink);opacity:0.85;margin:14px 0 22px;padding:14px 16px;background:var(--cream-2);border-left:4px solid var(--gold-deep);border-radius:0 10px 10px 0;}

  .section-title{font-size:0.98rem;font-weight:800;color:var(--brown-deep);margin:26px 0 12px;display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;}
  .section-title svg{width:18px;height:18px;color:var(--red);}

  .desc-text{font-size:0.96rem;line-height:1.7;color:var(--ink);opacity:0.88;}

  .strength-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .strength-item{background:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:0.87rem;font-weight:600;color:var(--brown-deep);display:flex;gap:8px;align-items:flex-start;}
  .strength-item svg{width:15px;height:15px;flex-shrink:0;margin-top:2px;color:var(--green-deep);}

  .bars{display:flex;flex-direction:column;gap:10px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-label{font-size:0.76rem;font-weight:700;color:var(--brown);width:92px;flex-shrink:0;}
  .bar-track{flex:1;height:9px;border-radius:999px;background:var(--cream-2);overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--red));}
  .bar-pct{width:34px;text-align:right;font-size:0.74rem;font-weight:700;color:var(--brown);font-family:'IBM Plex Mono',monospace;}

  .radar-wrap{background:var(--cream);border:1.5px solid var(--line);border-radius:18px;padding:20px 10px 8px;margin-bottom:16px;}

  .glossary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .glossary-card{background:var(--cream);border:1.5px solid var(--line);border-radius:13px;padding:12px 13px;}
  .glossary-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .glossary-letter{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:0.78rem;color:#fff;flex-shrink:0;}
  .glossary-name{font-size:0.85rem;font-weight:700;color:var(--brown-deep);}
  .glossary-def{font-size:0.78rem;line-height:1.5;color:var(--ink);opacity:0.78;}
  @media (max-width:520px){.glossary-grid{grid-template-columns:1fr;}}

  .career-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .career-chip{font-size:0.83rem;font-weight:600;padding:8px 13px;border-radius:11px;background:var(--green-deep);color:var(--cream);}

  .celeb-grid{display:flex;flex-direction:column;gap:10px;}
  .celeb-item{display:flex;gap:12px;background:var(--cream);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;align-items:flex-start;}
  .celeb-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(155deg,var(--gold),var(--red));flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--paper);font-weight:800;font-size:0.9rem;font-family:'Baloo 2',sans-serif;}
  .celeb-name{font-weight:700;font-size:0.9rem;color:var(--brown-deep);margin-bottom:2px;}
  .celeb-note{font-size:0.83rem;color:var(--ink);opacity:0.78;line-height:1.4;}

  .secondary-note{margin-top:24px;font-size:0.85rem;line-height:1.6;color:var(--brown);background:rgba(47,110,79,0.08);border-radius:12px;padding:14px 16px;}
  .secondary-note b{color:var(--green-deep);}

  .result-actions{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;}
  .btn-primary,.btn-ghost{border-radius:13px;padding:13px 20px;font-weight:700;font-size:0.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:var(--ink);color:var(--cream);border:none;}
  .btn-ghost{background:transparent;color:var(--brown-deep);border:1.6px solid var(--line);}
  .btn-primary svg,.btn-ghost svg{width:16px;height:16px;}

  footer.disclaimer{margin-top:18px;font-size:0.74rem;color:var(--brown);opacity:0.55;line-height:1.5;text-align:center;padding:0 10px;}

  /* ---------- shareable card (offscreen, captured to PNG) ---------- */
  .share-card-wrap{position:absolute;left:-99999px;top:0;width:540px;height:675px;}
  .share-card{width:540px;height:675px;position:relative;overflow:hidden;font-family:'Inter',sans-serif;display:flex;flex-direction:column;padding:36px 34px;color:var(--cream);}
  .share-card .sc-strip{position:absolute;top:0;left:0;right:0;height:10px;}
  .share-card .sc-brand{display:flex;align-items:center;gap:8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.1rem;}
  .share-card .sc-brand-dot{width:10px;height:10px;border-radius:50%;background:currentColor;}
  .share-card .sc-code{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:5.2rem;line-height:1;margin:34px 0 0;letter-spacing:0.01em;}
  .share-card .sc-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:2.1rem;margin:6px 0 0;line-height:1.1;}
  .share-card .sc-name-en{font-size:1.05rem;font-weight:600;opacity:0.85;margin-top:4px;}
  .share-card .sc-tagline{margin-top:22px;font-size:1.02rem;line-height:1.55;opacity:0.94;font-weight:500;max-width:92%;}
  .share-card .sc-strengths{margin-top:26px;display:flex;flex-direction:column;gap:9px;}
  .share-card .sc-strength{display:flex;align-items:center;gap:10px;font-size:0.88rem;font-weight:600;}
  .share-card .sc-strength .sc-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .share-card .sc-footer{margin-top:auto;padding-top:18px;border-top:1.5px solid rgba(255,255,255,0.28);display:flex;justify-content:space-between;align-items:flex-end;font-size:0.72rem;font-weight:600;opacity:0.85;}

  /* ---------- confetti ---------- */
  .confetti-piece{position:fixed;top:-20px;z-index:9999;border-radius:2px;pointer-events:none;animation:confettiFall linear forwards;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(105vh) rotate(540deg);opacity:0.9;}
  }

  /* ---------- community stat ---------- */
  .stat-note{margin-top:14px;font-size:0.83rem;line-height:1.55;color:var(--green-deep);background:rgba(47,110,79,0.09);border-radius:12px;padding:12px 15px;display:flex;align-items:center;gap:10px;}
  .stat-note svg{width:17px;height:17px;flex-shrink:0;}

  @media (max-width:520px){
    .wrap{padding:18px 14px 50px;}
    .hero{padding:26px 20px;}
    .hero h1{font-size:1.68rem;}
    .quiz-card{padding:22px 18px;}
    .q-text{font-size:1.1rem;}
    .result-inner{padding:22px 18px;}
    .strength-list{grid-template-columns:1fr;}
    .result-title-row{gap:12px;}
    .result-icon{width:52px;height:52px;}
    .result-icon svg{width:28px;height:28px;}
    .result-name{font-size:1.5rem;}
  }

  .fade-in{animation:fadeIn .35s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
  :focus-visible{outline:3px solid var(--gold-deep);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ============================= DATA ============================= */

// JEJAK's own strength-code system, like MBTI's letters — each dimension
// gets a single letter, and every type's code is its top two dimensions.
const LETTERS = { h:"J", e:"P", c:"T", v:"W", x:"K", s:"S" };
const LETTER_NAME = {
  J:{en:"Juang (Hustle)", bm:"Juang"},
  P:{en:"Peduli (Empathy)", bm:"Peduli"},
  T:{en:"Tangan (Craft)", bm:"Tangan"},
  W:{en:"Wawasan (Vision)", bm:"Wawasan"},
  K:{en:"Kreatif (Creativity)", bm:"Kreatif"},
  S:{en:"Struktur (Structure)", bm:"Struktur"},
};
function topDims(type){
  return Object.entries(type.v).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
}
function typeCode(type){
  const [p1,p2] = topDims(type);
  return LETTERS[p1]+LETTERS[p2];
}
function typeCodeLabel(type){
  const [p1,p2] = topDims(type);
  const l1 = LETTERS[p1], l2 = LETTERS[p2];
  return { en:`${LETTER_NAME[l1].en} + ${LETTER_NAME[l2].en}`, bm:`${LETTER_NAME[l1].bm} + ${LETTER_NAME[l2].bm}` };
}

/* ============================= STATE ============================= */
let state = {
  lang: "bm",
  screen: "start",
  qIndex: 0,
  scores: {h:0,e:0,c:0,v:0,x:0,s:0},
};

function computeResult(){
  let best=null, bestScore=-Infinity, second=null, secondScore=-Infinity;
  TYPES.forEach(t=>{
    let dot = 0;
    for(const k in t.v){ dot += (state.scores[k]||0) * t.v[k]; }
    if(dot > bestScore){ second=best; secondScore=bestScore; best=t; bestScore=dot; }
    else if(dot > secondScore){ second=t; secondScore=dot; }
  });
  const closeness = bestScore>0 ? Math.round((secondScore/bestScore)*100) : 0;
  return {best, second, bestScore, secondScore, closeness};
}

/* ============================= ICON HELPER ============================= */
function iconSvg(key, size=24, strokeColor="currentColor"){
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${strokeColor}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[key]}</svg>`;
}

/* ============================= RADAR CHART (JEJAK Core) ============================= */
function buildRadarSVG(scores, color){
  const order = ["h","e","c","v","x","s"];
  const n = order.length;
  const cx=150, cy=150, maxR=100;
  const angleStep = (Math.PI*2)/n;
  const startAngle = -Math.PI/2;
  const maxScore = QUESTIONS.length*3;

  function pointFor(i, r){
    const angle = startAngle + i*angleStep;
    return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
  }

  let gridPaths = "";
  [0.33,0.66,1].forEach(frac=>{
    const pts = order.map((d,i)=>pointFor(i, maxR*frac).map(v=>v.toFixed(1)).join(",")).join(" ");
    gridPaths += `<polygon points="${pts}" fill="none" stroke="rgba(34,27,20,0.13)" stroke-width="1"/>`;
  });

  const axisLines = order.map((d,i)=>{
    const [x,y] = pointFor(i, maxR);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(34,27,20,0.13)" stroke-width="1"/>`;
  }).join("");

  const dataPts = order.map((d,i)=>{
    const pct = Math.min(1, (scores[d]||0)/maxScore);
    const [x,y] = pointFor(i, maxR*pct);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");

  const dots = order.map((d,i)=>{
    const pct = Math.min(1, (scores[d]||0)/maxScore);
    const [x,y] = pointFor(i, maxR*pct);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${color}"/>`;
  }).join("");

  const labels = order.map((d,i)=>{
    const [x,y] = pointFor(i, maxR+24);
    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-family="'IBM Plex Mono',monospace" font-weight="700" font-size="15" fill="${color}">${LETTERS[d]}</text>`;
  }).join("");

  return `<svg viewBox="0 0 300 300" width="100%" height="auto" style="max-width:280px;display:block;margin:0 auto;">
    ${gridPaths}
    ${axisLines}
    <polygon points="${dataPts}" fill="${color}" fill-opacity="0.26" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}
    ${labels}
  </svg>`;
}

        <div class="about-stat"><div class="about-stat-num">91%</div><div class="about-stat-label">${t(UI.aboutStat2)}</div></div>
        <div class="about-stat"><div class="about-stat-num">RM526k</div><div class="about-stat-label">${t(UI.aboutStat3)}</div></div>
      </div>
    </div>
    <footer class="disclaimer">${t(UI.disclaimer)}</footer>
  `;
  bindGlobal();
  document.getElementById("startBtn").addEventListener("click", ()=>{ state.screen="quiz"; state.qIndex=0; render(); });
}

function renderQuiz(){
  const total = QUESTIONS.length;
  const idx = state.qIndex;
  const q = QUESTIONS[idx];
  const pct = Math.round((idx/total)*100);
  const opts = q.opts.map((o,i)=>`
    <button class="option" data-dim="${o.d}">
      <span class="letter">${String.fromCharCode(65+i)}</span>
      <span>${t(o.t)}</span>
    </button>`).join("");

  app.innerHTML = `
    ${topbar()}
    <div class="quiz-card fade-in">
      <div class="trail">
        <div class="trail-track"><div class="trail-fill" style="width:${pct}%"></div></div>
        <div class="trail-label">${idx+1}/${total}</div>
      </div>
      <div class="q-num">${UI.qCounter[state.lang](idx+1, total)}</div>
      <h2 class="q-text">${t(q.q)}</h2>
      <div class="options">${opts}</div>
      ${idx>0 ? `<button class="back-link" id="backBtn">← ${t(UI.back)}</button>` : ""}
    </div>
  `;
  bindGlobal();
  document.querySelectorAll(".option").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const d = btn.getAttribute("data-dim");
      state.scores[d] += 3;
      if(idx+1 >= total){
        state.screen = "result";
      } else {
        state.qIndex += 1;
      }
      render();
      window.scrollTo({top:0,behavior:"smooth"});
    });
  });
  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.addEventListener("click", ()=>{ restart(); });
}

        </div>

          <div class="code-hero-badge" style="color:${best.color};">${typeCode(best)}</div>

          <p>${t(UI.connectBody)}</p>

            <a class="social-btn" href="https://www.facebook.com/mereka.io" target="_blank" rel="noopener">${iconSvg("facebook",18)}</a>
            <a class="social-btn" href="https://www.linkedin.com/company/mereka/" target="_blank" rel="noopener">${iconSvg("linkedin",18)}</a>

function restart(){
  state = {lang:state.lang, screen:"start", qIndex:0, scores:{h:0,e:0,c:0,v:0,x:0,s:0}};
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- confetti (pure CSS/JS, no library) ---------- */
function fireConfetti(baseColor){
  const colors = [baseColor, "#E8A33D", "#2F6E4F", "#C8443A", "#5B3A22"];
  const count = 26;
  for(let i=0;i<count;i++){
    const el = document.createElement("div");
    el.className = "confetti-piece";
    const size = 6 + Math.random()*6;
    el.style.width = size+"px";
    el.style.height = (size*0.4)+"px";
    el.style.left = (Math.random()*100)+"vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2.2 + Math.random()*1.4)+"s";
    el.style.animationDelay = (Math.random()*0.4)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}

/* ---------- downloadable result card image ---------- */
async function downloadCard(type){
  const btn = document.getElementById("downloadBtn");
  const label = document.getElementById("downloadBtnLabel");
  const originalLabel = label.textContent;
  const node = document.getElementById("shareCardInner");
  if(!node || typeof html2canvas === "undefined"){
    console.error("html2canvas unavailable or share card missing");
    return;
  }
  try{
    btn.disabled = true;
    label.textContent = t(UI.downloading);
    if(document.fonts && document.fonts.ready){ await document.fonts.ready; }
    const canvas = await html2canvas(node, {scale:2, backgroundColor:null, useCORS:true});
    const link = document.createElement("a");
    link.download = `jejak-${typeCode(type).toLowerCase()}-${type.id}.png`;
    link.href = canvas.toDataURL("image/png");
    document.body.appendChild(link);
    link.click();
    link.remove();
  }catch(err){
    console.error("Could not generate the result card image:", err);
  }finally{
    btn.disabled = false;
    label.textContent = originalLabel;
  }
}

const SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwyBEjVZAV7US4taek6tMh8SVawGhj6Jb3qf_U7FjJE6H_Z4FnIeWY6WMuCA0sZnBpp/exec"; // e.g. "https://script.google.com/macros/s/AKfycb.../exec"

async function logResultToSheet(best, second, closeness){
  if(!SHEETS_WEBHOOK_URL) return; // not configured yet — skip silently
  try{
    const payload = {
      timestamp: new Date().toISOString(),
      code: typeCode(best),
      type_bm: best.name.bm,
      type_en: best.name.en,
      secondCode: second ? typeCode(second) : "",
      closenessPct: closeness,
      lang: state.lang,
      scores: state.scores
    };
    await fetch(SHEETS_WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    });
  }catch(err){
    console.error("Could not log result to Google Sheet:", err);
    // fail silently — this must never block the results page
  }
}

async function loadCommunityStats(best){
  const slot = document.getElementById("statNoteSlot");
  if(!slot || !window.storage) return;
  try{
    let counts = {};
    try{
      const existing = await window.storage.get("type-counts", true);
      if(existing && existing.value) counts = JSON.parse(existing.value);
    }catch(e){ /* key doesn't exist yet — start fresh */ }

    const code = typeCode(best);
    counts[code] = (counts[code]||0) + 1;
    await window.storage.set("type-counts", JSON.stringify(counts), true);

    const total = Object.values(counts).reduce((a,b)=>a+b, 0);
    const pct = Math.max(1, Math.round((counts[code]/total)*100));
    slot.innerHTML = `<div class="stat-note">${iconSvg("connector",17,"#1F4D37")}<span>${UI.statNote[state.lang](pct, code)}</span></div>`;
  }catch(err){
    console.error("Community stats unavailable:", err);
    // fail silently — this is a nice-to-have, not core functionality
  }
}

/* ---------- AI job-fit prompt ---------- */
function buildAiPrompt(type){
  const strengths = t(type.strengths).join("; ");
  const careers = t(type.careers).join(", ");
  if(state.lang === "bm"){
    return `Keputusan kekuatan saya dalam kuiz JEJAK ialah ${typeCode(type)} — ${type.name.bm} (${type.name.en}).

Kekuatan teras saya: ${strengths}.
Kerjaya yang biasanya sesuai dengan jenis ini: ${careers}.

Saya akan tampal satu iklan jawatan kosong di bawah. Berdasarkan kekuatan saya di atas, beri saya analisis yang jujur: adakah jawatan ini benar-benar sesuai dengan cara saya bekerja, bahagian mana yang mungkin buat saya bersemangat, bahagian mana yang mungkin melelahkan saya, dan apa yang perlu saya tanya atau perjelaskan sebelum memohon. Tolong jujur, jangan sekadar bagi semangat.

[TAMPAL BUTIRAN IKLAN JAWATAN DI SINI]`;
  }
  return `My strength result on the JEJAK quiz is ${typeCode(type)} — ${type.name.en} (${type.name.bm} in Malay).

My core strengths: ${strengths}.
Careers that typically fit this type: ${careers}.

I'm going to paste a job posting below. Based on my strengths above, give me an honest analysis: does this role genuinely fit how I work, which parts would likely energise me, which parts might drain me, and what I should ask or clarify before applying. Be direct, not just encouraging.

[PASTE JOB DESCRIPTION HERE]`;
}

async function copyPrompt(type){
  const label = document.getElementById("copyPromptLabel");
  const text = buildAiPrompt(type);
  const original = label.textContent;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    label.textContent = t(UI.copiedLabel);
    setTimeout(()=>{ label.textContent = original; }, 2000);
  }catch(err){
    console.error("Could not copy prompt:", err);
  }
}

/* ---------- LinkedIn share ---------- */
function shareToLinkedin(type){
  const caption = state.lang === "bm"
    ? `Saya baru dapat tahu kekuatan saya di JEJAK ialah ${typeCode(type)} — ${type.name.bm} (${type.name.en}). Kuiz kekuatan & kerjaya ni dibina dalam semangat Mereka Innovative Education. Cuba sendiri dan ikuti Mereka untuk lebih banyak: https://mereka.io`
    : `I just found out my JEJAK type is ${typeCode(type)} — ${type.name.en} (${type.name.bm} in Malay). This strength & career quiz was built in the spirit of Mereka Innovative Education. Give it a go and follow Mereka for more: https://mereka.io`;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(caption).catch(()=>{});
    }
  }catch(e){ /* clipboard optional here */ }
  window.open("https://www.linkedin.com/sharing/share-offsite/?url=" + encodeURIComponent("https://mereka.io"), "_blank", "noopener");
}

function bindGlobal(){
  document.querySelectorAll("[data-lang]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.lang = btn.getAttribute("data-lang");
      render();
    });
  });
}

function render(){
  if(state.screen==="start") renderStart();
  else if(state.screen==="quiz") renderQuiz();
  else renderResult();
}

render();
